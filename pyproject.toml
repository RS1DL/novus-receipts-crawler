[project]
name = "novus-receipts"
version = "0.1.0"
description = "Service for collecting Novus receipts / purchases / bonuses for a single account over HTTP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.4",
]

[project.scripts]
novus-receipts = "novus_receipts.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novus_receipts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["novus_receipts"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
